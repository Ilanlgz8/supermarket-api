
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supermarket-receipt-api"
version = "0.1.0"
description = "Supermarket Receipt : API pédagogique de caisse, tests, CI et déploiement local."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["supermarket_receipt_api*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
