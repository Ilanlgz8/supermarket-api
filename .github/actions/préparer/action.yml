name: "Préparer l'environnement"
description: "Installer Python, uv et les dépendances avec cache"

runs:
  using: "composite"
  steps:
    - name: "Installer Python et uv"
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock

    - name: "Installer les dépendances"
      shell: bash
      run: uv sync --locked